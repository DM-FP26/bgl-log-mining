# Training configuration for the LSTM/GRU next-event models.
seed: 42

data:
  windows_path: handoff/windows.npz

model:
  type: lstm            # overridden by --model lstm|gru
  embed_dim: 64
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2

train:
  batch_size: 512
  epochs: 20
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  early_stop_patience: 3
  amp: false            # keep off unless there is a reason
  num_workers: 0        # Windows: keep 0

embed:
  pooling: mean         # mean | last
