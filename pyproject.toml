[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgllog"
version = "0.1.0"
description = "BGL log mining: LSTM/GRU embeddings, clustering and pattern mining (Data Mining final project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
